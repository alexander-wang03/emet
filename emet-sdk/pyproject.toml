[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emet-sdk"
version = "0.3.0"
description = "Emet SDK — types, schemas, and contracts shared by the engine and all plugins."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Emet Authors" }]
keywords = ["emet", "robotics", "companion", "hal"]

dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
emet = "emet_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["emet_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "emet_sdk/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
