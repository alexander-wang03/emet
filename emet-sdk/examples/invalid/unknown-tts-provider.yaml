# INVALID: a voice that is not installed, named by the body.
#
# `models.tts.provider` on a body resolves against installed `emet.tts`
# plugins, exactly as `models.stt.provider` and `models.chat.provider`
# resolve against theirs. The value below is legal and does not resolve, and
# on a body that is an error: a body is one machine, and it has named
# software that has to be installed on it. The soul's `models.tts.provider`
# is never checked this way; a soul has to be valid on every machine or on
# none.
#
# Expected: missing_plugin, /models/tts/provider

manifest_version: "0.1"

body:
  id: voiceless
  name: "a body whose voice is on order"
  scale: desk
  power: plugged_in

audio:
  input:
    device: "plughw:1,0"
    sample_rate: 16000
    channels: 1
    aec: hardware
    doa: false
  output:
    device: "plughw:1,0"
    gain_db: -6.0

models:
  tts:
    provider: gramophone

capabilities: []
