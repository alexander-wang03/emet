# INVALID: home_deg lies outside range_deg.
#
# The tilt joint travels [-30, 45] but homes to 60. Homing would drive the
# joint into its own limit: a mechanical failure, on first boot, before
# anyone has said a word to it.
#
# JSON Schema cannot express this: it is a comparison between two sibling
# fields. It is exactly the class of rule that justifies a semantic layer.
#
# Expected: home_out_of_range, /capabilities/0/joints/1/home_deg

manifest_version: "0.1"

body:
  id: overshoot
  name: "a robot whose head homes into its own limit"
  scale: desk
  power: plugged_in

audio:
  input:  {device: "plughw:1,0", sample_rate: 16000, channels: 1, aec: hardware, doa: false}
  output: {device: "plughw:1,0", gain_db: -6.0}

capabilities:
  - id: head
    type: joint_group
    role: head
    driver: {plugin: emet_hal.pca9685, params: {bus: 1, address: 0x40}}
    joints:
      - {id: pan,  axis: yaw,   channel: 0, range_deg: [-90, 90], home_deg: 0}
      - {id: tilt, axis: pitch, channel: 1, range_deg: [-30, 45], home_deg: 60}
