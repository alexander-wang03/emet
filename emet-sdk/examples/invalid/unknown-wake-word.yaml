# INVALID: a wake word outside the shipped pretrained set.
#
# `identity.name` is free text — this soul is legitimately called Barnaby, and
# nothing rejects that. `identity.wake_word` must name a wake word the engine
# can actually detect, and P0 ships a fixed pretrained set because custom wake
# words are RSV pending licensing.
#
# The fix is one line: set `wake_word: emet` and keep the name. The soul is
# then called Barnaby and answers to "Emet" — which its persona can be told
# about, turning a P0 limitation into character rather than hiding it.
#
# Expected: unknown_wake_word, /identity/wake_word

bundle_version: "0.1"

identity:
  name: "Barnaby"
  wake_word: "barnaby"
  line: custom
  pronouns: "he/him"
  author: "a builder who has not read section 8.1.1"
  created: "2026-08-11"

persona:
  summary: >
    Fussy, formal, and quietly delighted by procedure.
  traits:
    warmth: 0.5
    humor: 0.2
    verbosity: 0.6
    curiosity: 0.4
    formality: 0.9
