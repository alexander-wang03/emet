# Emet CI.
#
# Two things are checked, and the second matters more than it looks.
#
#   tests     — the 0.1 acceptance criteria, executable.
#   layering  — emet_sdk imports nothing internal; emet_hal and emet_engine
#               import emet_sdk only.
#
# The layering check exists because the closed-engine plan used to enforce that
# boundary structurally, and an open monorepo does not. See DISTRIBUTION.md §2.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layering:
    name: layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check package layering
        run: python tools/check_layering.py .

  dco:
    name: dco sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "missing sign-off: $sha  $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo
            echo "Emet uses a DCO. Sign your commits with 'git commit -s',"
            echo "or add sign-off to existing work with 'git rebase --signoff <base>'."
            echo "See CONTRIBUTING.md."
            exit 1
          fi
          echo "all commits signed off"

  wheel:
    name: wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Data files live in two different places depending on how you install.
      # In a source checkout `schemas/` sits BESIDE the package; in a built
      # wheel `force-include` moves it INSIDE. An editable install keeps the
      # source layout, so every other job in this file exercises only one of
      # those two paths — and it is the path no user of the project ever takes.
      #
      # A typo in the force-include would leave the whole suite green and break
      # the first person to run `pip install emet-sdk`. So: build a real wheel,
      # install it properly, and run from somewhere the source tree cannot be
      # found by accident.
      - name: Build wheels
        run: |
          python -m pip install --upgrade build
          python -m build --wheel emet-sdk
          python -m build --wheel emet-hal

      - name: Data files are actually inside the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("emet-sdk/dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "emet_sdk/schemas/body-manifest.schema.json",
              "emet_sdk/schemas/soul-bundle.schema.json",
              "emet_sdk/schemas/motion-pack.schema.json",
              "emet_sdk/chains/core.yaml",
              "emet_sdk/chains/express.yaml",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              print(f"{wheel} is missing packaged data files:")
              for m in missing:
                  print(f"  - {m}")
              sys.exit(1)
          print(f"all {len(required)} data files present in {wheel}")
          PY

      - name: Install the wheels, not the source
        run: |
          python -m pip install emet-sdk/dist/*.whl emet-hal/dist/*.whl

      # `cd /tmp` is the point of this step: from here the source checkout is
      # not on the path, so anything that resolves must be coming out of the
      # installed package.
      - name: CLI works from outside the source tree
        run: |
          cd /tmp
          emet --version
          emet validate "$GITHUB_WORKSPACE/emet-sdk/examples/bodiless.yaml"
          emet validate "$GITHUB_WORKSPACE/emet-sdk/examples/mock-scout.yaml" --verify-drivers
          emet explain  "$GITHUB_WORKSPACE/emet-sdk/examples/mock-scout.yaml" --why

      - name: Plugin discovery works from an installed wheel
        run: |
          cd /tmp
          python - <<'PY'
          from emet_sdk.discovery import PluginRegistry
          r = PluginRegistry.discover()
          assert r.has_locomotion("differential"), "entry points did not survive packaging"
          assert r.has_locomotion("tracked")
          assert r.has_driver("emet_hal.mock")
          print("discovered:", [f"{g}:{n}" for g, n in r])
          PY

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # emet-hal is installed too, and not only so its own tests run: plugin
      # discovery reads entry points, so several SDK tests are meaningless
      # unless something is actually registered to discover.
      - name: Install packages
        run: |
          python -m pip install -e "emet-sdk[dev]"
          python -m pip install -e "emet-hal[dev]"

      - name: Test emet-sdk
        working-directory: emet-sdk
        run: python -m pytest -q

      - name: Test emet-hal
        working-directory: emet-hal
        run: python -m pytest -q

      # Exercises the CLI against the editable install. This does NOT prove the
      # packaged layout works — see the `wheel` job for that.
      - name: CLI accepts the valid examples
        working-directory: emet-sdk
        run: emet validate examples/bodiless.yaml examples/scout-01.yaml examples/emet-soul.yaml

      # A manifest wired entirely to installed plugins must pass the strict
      # check the engine will apply at boot.
      - name: Fully-mocked manifest passes the boot-strictness check
        working-directory: emet-sdk
        run: emet validate examples/mock-scout.yaml --verify-drivers

      - name: Binding tables resolve
        working-directory: emet-sdk
        run: |
          emet explain examples/bodiless.yaml
          emet explain examples/mock-scout.yaml --why

      - name: CLI rejects the invalid examples
        working-directory: emet-sdk
        run: |
          for f in examples/invalid/*.yaml; do
            if emet validate "$f" > /dev/null 2>&1; then
              echo "FAIL: $f validated clean but should not have"
              exit 1
            fi
          done
          echo "all invalid fixtures rejected"
