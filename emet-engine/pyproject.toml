[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emet-engine"
version = "0.5.7"
description = "Emet's listen loop and the runtime that drives a body."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Emet Authors" }]
keywords = ["emet", "robotics", "engine"]

# emet-sdk only, and deliberately. Drivers, wake engines and audio sources
# reach this package through entry points, never through an import, so
# depending on `emet-hal` here would create exactly the coupling the layering
# check exists to prevent. A working robot installs both.
dependencies = ["emet-sdk>=0.5.7"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
emet-listen = "emet_engine.cli:main"
emet-talk = "emet_engine.talk:main"
emet-say = "emet_engine.say:main"

[tool.hatch.build.targets.wheel]
packages = ["emet_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every warning is an error. One raised while a test runs, such as a
# deprecated call, fails that test. One raised when an object is freed,
# such as an unclosed file or connection or a coroutine never awaited,
# fails whichever test is running then, which can be a later one, and one
# raised while the test files are imported fails the collection. A warning
# from inside somebody else's package that Emet cannot fix gets one narrow
# `ignore` line below `error`, naming its category, the start of its
# message and its module, with the package and version that raise it.
filterwarnings = ["error"]
