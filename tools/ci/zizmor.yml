# zizmor's configuration for this repository (CI3). `tools/ci.py layering`
# passes it with --config, so zizmor reads this file and no other. The keys
# are zizmor's (docs.zizmor.sh, configuration and audits, read 2026-11-26,
# for zizmor 1.32.0).
#
# A finding the project accepts is listed under `ignore` with its reason.
# There is one, and it shows only at the pedantic and auditor personas.

rules:
  # Every action, GitHub's own included, is pinned to a full commit SHA.
  # This is zizmor's default since v1.20.0. It is written out so that a new
  # default cannot loosen it, and because "Require SHA pinning", turned on at
  # 0.5.6's close (E12 (b)), refuses anything else.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # Seven days before Dependabot proposes a release. Seven is zizmor's
  # default; it is written out because .github/dependabot.yml and
  # tools/ci/requirements.in keep the same wait. 1.32.0 read the first
  # entry's wait alone in the review of 2026-11-26, so
  # tools/ci/check_workflows.py holds every entry.
  dependabot-cooldown:
    config:
      days: 7

  # Accepted: release-audit.yml has no concurrency group, on purpose. An
  # edit and `gh pr ready` a second apart start two runs on one commit, and
  # a run the other cancelled could be the one a required check on master
  # reads. The job is read-only and takes seconds, so every run finishes.
  concurrency-limits:
    ignore:
      - release-audit.yml
