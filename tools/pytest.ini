# The tools' tests, run from the repository's root as
# `python -m pytest tools/tests`. pytest reads the nearest configuration file
# at or above the tests it was given, so this file is theirs alone and each
# of the four packages keeps the `[tool.pytest.ini_options]` of its own
# `pyproject.toml`.
#
# Every warning is an error, as in the four packages. One raised while a
# test runs, such as a deprecated call, fails that test. One raised when an
# object is freed, such as an unclosed file or connection or a subprocess
# never waited for, fails whichever test is running then, which can be a
# later one, and one raised while the test files are imported fails the
# collection. A warning from inside somebody else's package that Emet cannot
# fix gets one narrow `ignore` line below `error`, naming its category, the
# start of its message and its module, with the package and version that
# raise it.
[pytest]
filterwarnings =
    error
